# XcodeGen 定義。.xcodeproj は生成物なのでコミットしない:
#   brew install xcodegen && cd app/MokkoriIQ && xcodegen
# で MokkoriIQ.xcodeproj を再生成して Xcode で開く。
name: MokkoriIQ
options:
  bundleIdPrefix: com.ojimpo
  deploymentTarget:
    iOS: "17.0"
packages:
  MokkoriCore:
    path: ../MokkoriCore
targets:
  MokkoriIQUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MokkoriIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ojimpo.mokkori-iq.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MokkoriIQ
  MokkoriIQ:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MokkoriCore
    info:
      path: Sources/Info.plist
      properties:
        # OAuth はアプリ内で行わない（Strava への投稿は NAS のゲートウェイ経由）
        # ため、カスタム URL スキームの登録は不要。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDisplayName: Mokkori IQ
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        PRODUCT_BUNDLE_IDENTIFIER: com.ojimpo.mokkori-iq
        TARGETED_DEVICE_FAMILY: "1"          # iPhone 専用
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 上の info: ブロックが Info.plist を生成するので INFOPLIST_KEY_* は使わない
